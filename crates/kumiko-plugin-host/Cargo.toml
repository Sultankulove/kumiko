[package]
name = "kumiko-plugin-host"
description = "Plugin Host: manifests, registry, supervision, interfaces, kits, KPP bridge."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
kumiko-types.workspace = true
kumiko-protocol.workspace = true
kumiko-ipc.workspace = true
kumiko-service-api.workspace = true
globset.workspace = true
semver.workspace = true
serde.workspace = true
thiserror.workspace = true
toml.workspace = true

serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "process", "io-util", "macros"] }
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile.workspace = true
