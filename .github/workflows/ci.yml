name: CI

on:
  push:
    # staging too: stages merge there (spec v1.1, section 7), and its caches serve their PRs.
    branches: [main, staging]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check

  # Linux and Windows are both MVP platforms (ADR-020).
  clippy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rust-cache keys on every installed toolchain; the runner images' own stable changes
      # (1.99.0 / 1.99.1), which made Linux miss the cache. Only rust-toolchain.toml's remains.
      - name: Toolchain
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup toolchain uninstall stable || true
      # Saved only on pushes to main and staging: PRs restore those, and saving from every PR
      # cost minutes (4.5 on Windows) and raced between jobs.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' }}
      # GPUI (kumiko-ui) links X11, Wayland, xkbcommon, fontconfig and Vulkan on Linux.
      - name: Install UI build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libfontconfig-dev libx11-xcb-dev
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # WASM plugins compile their component exports only for the wasm target.
      - run: cargo clippy -p kumiko-plugin-sdk -p kumiko-echo-wasm --target wasm32-wasip2 --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            wasi-sdk: x86_64-linux
          - os: windows-latest
            wasi-sdk: x86_64-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rust-cache keys on every installed toolchain; the runner images' own stable changes
      # (1.99.0 / 1.99.1), which made Linux miss the cache. Only rust-toolchain.toml's remains.
      - name: Toolchain
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup toolchain uninstall stable || true
      # Saved only on pushes to main and staging: PRs restore those, and saving from every PR
      # cost minutes (4.5 on Windows) and raced between jobs.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' }}
      - name: Install UI build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libfontconfig-dev libx11-xcb-dev
      # The reference WASM plugin in C (MVP criterion 16) is built with wasi-sdk.
      - name: Install wasi-sdk
        shell: pwsh
        run: |
          $name = "wasi-sdk-34.0-${{ matrix.wasi-sdk }}"
          curl -sSfL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/$name.tar.gz" -o "$env:RUNNER_TEMP/wasi-sdk.tar.gz"
          tar -xzf "$env:RUNNER_TEMP/wasi-sdk.tar.gz" -C "$env:RUNNER_TEMP"
          "WASI_SDK_PATH=$(Join-Path $env:RUNNER_TEMP $name)" >> $env:GITHUB_ENV
      # includes tests/architecture.rs: crate graph and language-agnostic L0/L1
      - run: cargo test --workspace --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
