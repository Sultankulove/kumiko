# Test fixture of the Plugin Host (spec, section 28, E4) and a minimal process plugin example.
[plugin]
id = "kumiko.echo"
name = "Echo"
version = "0.1.0"
api = "^0.1"
kind = "process"
entry = "bin/kumiko-echo"
activation = ["onCommand:echo.*"]

[[contributes.commands]]
id = "echo.say"
title = "Echo: say"

[[contributes.commands]]
id = "echo.whoami"
title = "Echo: who am I"

[[contributes.commands]]
id = "echo.exit"
title = "Echo: exit with a code"

[[contributes.commands]]
id = "echo.hang"
title = "Echo: never answer"

[[contributes.commands]]
id = "echo.call"
title = "Echo: call an interface method"

[[contributes.commands]]
id = "echo.spawn"
title = "Echo: start a child process"

# An interface the plugin provides and, to exercise routing through the core, also consumes.
[[provides]]
interface = "kumiko.echo.api"
version = "1.2.0"

[[consumes]]
interface = "kumiko.echo.api"
version = "^1"
optional = true

# A language served by the fake language server of tests/fixtures (Language service tests).
[[contributes.languages]]
id = "fakelang"
extensions = [".fake"]

[[contributes.languageServers]]
id = "fake"
languages = ["fakelang"]
launch = "dynamic"

[[contributes.commands]]
id = "echo.lsp"
title = "Echo: send a request to the language server"
