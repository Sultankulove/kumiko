[resource]
id = "kumiko.keymap.default"
kind = "keymap"
version = "0.1.0"
name = "%keymap.default%"

[[binding]]
key = "ctrl+s"
command = "file.save"

[[binding]]
key = "ctrl+k s"
command = "file.saveAll"

[[binding]]
key = "ctrl+z"
command = "edit.undo"
when = "editorFocus"

[[binding]]
key = "ctrl+shift+z"
command = "edit.redo"
when = "editorFocus"

[[binding]]
key = "ctrl+y"
command = "edit.redo"
when = "editorFocus"

[[binding]]
key = "ctrl+p"
command = "workbench.quickOpen"

[[binding]]
key = "ctrl+shift+p"
command = "workbench.showCommands"

# Tool windows, as in JetBrains IDEs.
[[binding]]
key = "alt+1"
command = "workbench.toggleProject"

[[binding]]
key = "alt+6"
command = "workbench.toggleProblems"

[[binding]]
key = "ctrl+q"
command = "workbench.quit"
