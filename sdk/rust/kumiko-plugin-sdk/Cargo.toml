[package]
name = "kumiko-plugin-sdk"
description = "Rust SDK for Kumiko plugins (process and wasm kinds)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
kumiko-protocol.workspace = true
kumiko-ipc.workspace = true
kumiko-types.workspace = true
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "sync", "io-std", "io-util", "macros"] }

[features]
process = ["dep:serde_json", "dep:thiserror", "dep:tokio"]

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "time"] }

[[test]]
name = "process"
required-features = ["process"]
