# cargo-deny configuration: licenses, advisories, bans, sources.
# Project license is Apache-2.0 (ADR-009); dependencies must be compatible with it.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Unmaintained (not vulnerable) crates the UI stack pulls in (GPUI 0.2.2, ADR-003). GPUI is pinned;
# revisit this list on every GPUI upgrade. Vulnerabilities are never ignored here.
ignore = [
    { id = "RUSTSEC-2024-0384", reason = "instant, via the UI stack (futures-lite 1)" },
    { id = "RUSTSEC-2024-0436", reason = "paste, via the UI stack" },
    { id = "RUSTSEC-2025-0052", reason = "async-std, via the UI stack" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile, via the UI stack" },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2, via the UI stack" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser, via the GPUI text stack" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz, via the GPUI text stack" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant, via the UI stack (ashpd, Linux portals)" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names, via the UI stack (ashpd, Linux portals)" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive, via the UI stack (ashpd, Linux portals)" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# The list is a policy, not an inventory: entries may be unused until a dependency needs them.
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    # File-level copyleft: acceptable as an unmodified dependency (spec, section 24; e.g. nucleo).
    "MPL-2.0",
    # Permissive, BSD-like (libfuzzer-sys via GPUI -> image -> rav1e).
    "NCSA",
    # Permissive data licence of the Mozilla CA roots (webpki-roots, via ureq in kumiko.java).
    "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
