[package]
name = "kumiko-process"
description = "Process service: processes, PTY, output streams, tree termination, tasks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
kumiko-types.workspace = true
kumiko-service-api.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "process", "macros"] }
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "io-util", "time"] }
