# kumiko.terminal (spec, section 19): what a terminal session runs. The core starts it in a
# pseudo-terminal and the terminal view shows it; the bytes do not pass through this plugin.
# Build: cargo build -p kumiko-terminal --release --target wasm32-wasip2 → plugin.wasm.
[plugin]
id = "kumiko.terminal"
name = "Terminal"
version = "0.1.0"
api = "^1.0"
kind = "wasm"
entry = "plugin.wasm"
permissions = ["process.spawn"]
activation = ["onCommand:terminal.*"]

[[contributes.commands]]
id = "terminal.new"
title = "New Terminal Session"

[contributes.configuration]
schema = "schema/config.json"
